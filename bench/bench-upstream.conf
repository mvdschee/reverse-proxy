# upstream for the benchmarks, see docs/benchmarks.md
# start: nginx -p "$PWD/bench" -c "$PWD/bench/bench-upstream.conf"
# relative paths below resolve against the -p prefix (bench/)

# match the number of cores nginx is pinned to with taskset
worker_processes 2;
daemon off;
pid nginx.pid;
error_log stderr warn;

events {
	worker_connections 65535;
}

http {
	access_log off;
	default_type application/octet-stream;
	sendfile on;
	tcp_nopush on;

	# the proxy keeps upstream connections alive, nginx shouldn't be the one closing them
	keepalive_requests 1000000;
	keepalive_timeout 120s;

	client_body_temp_path tmp/body;
	proxy_temp_path tmp/proxy;
	fastcgi_temp_path tmp/fastcgi;
	uwsgi_temp_path tmp/uwsgi;
	scgi_temp_path tmp/scgi;

	server {
		# all interfaces, so the Mac can hit the baseline directly
		listen 9000 reuseport backlog=65535;
		root www;

		location = /tiny {
			return 200 "ok\n";
		}

		location = /api {
			default_type application/json;
			try_files /api.json =404;
		}

		location = /page {
			default_type text/html;
			try_files /page.html =404;
		}

		location /files/ {
		}

		# 1m at 64k/s takes ~16s per request
		location /slow/ {
			alias www/files/;
			limit_rate 64k;
		}

		# nginx reads and drops the body
		location = /upload {
			client_max_body_size 200m;
			return 200 "ok\n";
		}

		location = /error {
			return 500;
		}

		location = /redirect {
			return 302 /tiny;
		}
	}
}
